name: executable-extension-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-extension.txt
      - run: pytest -q
      - run: python code/rc_stats.py --clusters data/cluster_summary.csv > /tmp/historical-stats.json
      - run: python -m axiom_x.demo > /tmp/synthetic-demo.json
